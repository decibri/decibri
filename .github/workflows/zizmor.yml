name: Workflow Audit

# zizmor audits the workflow files themselves: action pins, job permissions,
# expression expansion into run blocks, and trigger safety. Path-filtered to
# .github/** because that is the only input it reads, and those files change
# rarely; running it on every commit would be noise. workflow_dispatch is
# there so the audit can be run on demand before a release tag is pushed.
on:
  push:
    branches: [main, development]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main, development]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      # Reads the workflow files.
      contents: read
      # Uploading SARIF to the Security tab. This is the only write scope in
      # the workflow. Same shape as the scan job in osv-scanner.yml.
      security-events: write
      # codeql-action/upload-sarif reads the workflow run it uploads for.
      actions: read
    steps:
      # An audit that checks for unpinned actions has to be pinned itself.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # Pinned exactly. zizmor adds audits between releases, so an unpinned
      # upgrade turns a green gate red on a commit that changed nothing.
      # The policy and every accepted exception live in .github/zizmor.yml.
      #
      # SARIF is written to stdout, so it is redirected to a file. This run
      # reports and does not gate: zizmor sets a finding-based exit code for
      # its other output formats but not for SARIF, so it exits zero here
      # even when it finds something. It still exits non-zero on an internal
      # error, which is what should stop the job at this point.
      - name: Audit workflows (SARIF)
        run: uvx zizmor@1.29.0 --no-progress --format=sarif .github/workflows > zizmor.sarif
      - name: Upload results to the Security tab
        if: ${{ !cancelled() && hashFiles('zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      # The gate: any finding not recorded in .github/zizmor.yml fails the job.
      #
      # .github/zizmor.yml is an accepted-exception list, so a finding outside
      # it means a workflow file changed without that change being accounted
      # for. The only input this audit reads is .github, so nothing outside
      # this repository can raise a finding here and every one of them points
      # at the commit that introduced it. Blocking the merge is what that
      # calls for.
      #
      # This step runs after the upload so the findings reach the Security tab
      # whether or not it fails.
      - name: Fail on unrecorded findings
        run: uvx zizmor@1.29.0 --no-progress .github/workflows
