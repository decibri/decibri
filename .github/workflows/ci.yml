name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Every job here reads source, compiles, and runs tests. None writes to the
# repository, opens an issue, or requests an OIDC token, so the whole workflow
# runs on a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # Action references are pinned to commit SHAs with a version comment.
      # The policy and its one exception (dtolnay/rust-toolchain) live in
      # .github/zizmor.yml, which enforces them in CI.
      #
      # actions/checkout appears here at v6.1.0 and in the deny job at
      # v6.0.2. The deny job was pinned earlier at the version current then;
      # both are the version each site already ran. Dependabot's grouped
      # github-actions update converges them.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: "rust"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # --all-targets lints the test targets as well as the library. The
      # published crate ships src/ including its test modules, and the sdist
      # ships bindings/python/tests/, so a lint in test code is a lint in what
      # a consumer downloads. Without this flag the test targets are never
      # linted here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    # This job reads the dependency graph and the lockfile. It writes nothing
    # and needs no token beyond source access.
    permissions:
      contents: read
    # Deliberately not gated on `lint`. It compiles nothing and finishes in
    # seconds, so running it in parallel puts a licence or advisory failure in
    # front of a reviewer at the same time as a formatting one.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          # Distinct from the "rust" key the compiling jobs share. This job
          # builds nothing and only needs the registry warm, so it neither
          # depends on nor overwrites their target/ cache.
          shared-key: "rust-deny"
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          # Pinned exactly. cargo-deny's config semantics change between minor
          # versions, so an unpinned upgrade can silently change what
          # deny.toml means.
          tool: cargo-deny@0.20.2
      # All four checks: advisories, licenses, bans, sources. deny.toml holds
      # the policy and the reasoning for each setting. The four cost under two
      # seconds once warm; the advisory database adds about eight seconds and
      # 2 MB on a cold runner, which is too small to be worth caching.
      - run: cargo deny check

  test-rust:
    name: Rust Tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      # The golden VAD anchors are pinned to values generated on Windows and
      # carry a 1e-4 tolerance sized for cross-platform ORT CPU-kernel drift, so
      # run them on every platform rather than ubuntu only. macOS in particular
      # had no coverage of the pinned trajectories before. windows-11-arm runs
      # them natively on Windows ARM64.
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: "rust"
      - name: Install ALSA (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests (download-binaries; runs the golden VAD anchors)
        run: cargo test-decibri
      # Exercise the ort-load-dynamic load-failure path (compiled out by the
      # test-decibri alias, which uses download-binaries). The failure-path
      # tests pass a bad ort_library_path and assert the OrtPathInvalid
      # pre-check fires, so they need no real ORT dylib. Runs on every OS,
      # which matters most on Windows where the original init_from hang
      # reproduced.
      - name: ORT load-dynamic failure-path tests
        run: cargo test -p decibri --no-default-features --features capture,playback,vad,denoise,gain,ort-load-dynamic --test vad_ort_load_failure

  feature-combinations:
    name: Feature Combinations (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      # Each meaningful feature selection is exercised so a change that breaks
      # a feature gate (a module, a re-export, or a DecibriError variant that
      # fails to compile under some combination) is caught, and so the test
      # targets stay compilable, and where possible green, under every
      # combination. Each cell carries its own command:
      #   - The cells with no ONNX Runtime dependency (capture, playback,
      #     capture+playback) run `cargo test`: lib tests, integration tests,
      #     and doctests under that feature selection.
      #   - The ORT-backed cells run `cargo check --all-targets`, which
      #     type-checks every test target without linking or downloading ONNX
      #     Runtime. All three pin ort-load-dynamic (`vad` and `no-vad-full`
      #     explicitly, which the distribution-mode guard in lib.rs requires),
      #     so they compile; their tests cannot execute here because no ORT
      #     dylib is resolvable on a runner. The maximal feature set's tests
      #     run in the Rust Tests job via the cargo test-decibri alias
      #     (ort-download-binaries).
      #
      # Exclusions, by design:
      #   - The execution-provider features (coreml, cuda, directml, rocm) are
      #     passthroughs to ORT provider backends that require platform SDKs
      #     (e.g. the CUDA toolkit) not installed on the runner, so they are not
      #     built here.
      #   - The two ORT distribution modes (ort-load-dynamic and
      #     ort-download-binaries) are mutually exclusive (compile_error! in
      #     lib.rs), so there is no single "all features" build. The `default`
      #     entry below is the maximal CI-compilable set (it pins
      #     ort-load-dynamic).
      matrix:
        include:
          - { name: default, command: "check --all-targets", flags: "" }
          - { name: capture, command: "test", flags: "--no-default-features --features capture" }
          - { name: playback, command: "test", flags: "--no-default-features --features playback" }
          - { name: capture+playback, command: "test", flags: "--no-default-features --features capture,playback" }
          - { name: vad, command: "check --all-targets", flags: "--no-default-features --features vad,ort-load-dynamic" }
          - { name: no-vad-full, command: "check --all-targets", flags: "--no-default-features --features capture,playback,denoise,gain,ort-load-dynamic" }
          # Echo cancellation without ORT. `test` rather than `check`, because the
          # canceller needs no ONNX Runtime, so the AEC tests can actually run
          # here; every other cell that compiles `aec` either has no ORT-free
          # test target or only type-checks, so this is the one cell that
          # executes them.
          - { name: capture+aec, command: "test", flags: "--no-default-features --features capture,aec" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: "rust"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo ${{ matrix.command }} (${{ matrix.name }})
        run: cargo ${{ matrix.command }} -p decibri ${{ matrix.flags }}

  test-node:
    name: Node.js Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: "rust"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            npm/decibri/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install npm dependencies
        run: cd npm/decibri && npm install --ignore-optional
      - name: Build native addon
        run: cd npm/decibri && npm run build
      - name: Run CI-safe tests
        run: node tests/test-ci.js

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install vitest
        run: npm install
      - name: Run browser unit tests
        run: npx vitest run
